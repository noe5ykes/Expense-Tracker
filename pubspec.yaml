name: expense_tracker
description: "Verda — a premium, offline-first expense manager for Android and iOS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & navigation
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

  # Local database (offline-first)
  drift: ^2.26.0
  drift_flutter: ^0.2.4

  # Models & serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.12.0

  # Networking (for future cloud sync)
  dio: ^5.7.0

  # Notifications
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0

  # Localization
  intl: any

  # UI
  responsive_framework: ^1.5.1
  fl_chart: ^1.0.0
  dynamic_color: ^1.7.0
  cupertino_icons: ^1.0.8

  # Media
  image_picker: ^1.1.2

  # Storage & security
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Reports & sharing
  pdf: ^3.11.0
  csv: ^6.0.0
  excel: ^4.0.6
  share_plus: ^11.0.0
  file_picker: ^10.0.0

  # Misc
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.26.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  generate: true
